name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin-src

      - name: Checkout vbwd-fe-user
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-fe-user
          path: vbwd-fe-user
          submodules: recursive

      - name: Overlay plugin source
        run: cp -r plugin-src/. vbwd-fe-user/plugins/subscription/

      # subscription lazily imports the cms plugin (../cms/src/... — the
      # widget registry and the SEO head helper used by the S154 public plan
      # pages). The host checkout ships no cms plugin, so overlay it as a peer
      # (same pattern as cms-youtube).
      - name: Checkout cms peer
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-fe-user-plugin-cms
          path: peer-cms

      - name: Overlay peers
        run: |
          mkdir -p vbwd-fe-user/plugins/cms
          cp -r peer-cms/. vbwd-fe-user/plugins/cms/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vbwd-fe-user/package-lock.json

      - name: Build vbwd-fe-core submodule
        run: |
          cd vbwd-fe-user/vbwd-fe-core
          npm install
          npm run build

      - name: Install dependencies
        run: |
          cd vbwd-fe-user
          npm install

      - name: Run plugin tests
        run: |
          cd vbwd-fe-user
          if find plugins/subscription -name "*.spec.ts" -o -name "*.test.ts" | grep -q .; then
            npx vitest run plugins/subscription --reporter=verbose
          else
            echo "No tests found for subscription — skipping."
          fi
